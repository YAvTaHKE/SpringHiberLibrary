<head>
    <meta charset="UTF-8">
    <title>Show person</title>
</head>
<body>
<p th:text="${person.fullName + ', ' + person.yearOfBirth}">John Doe, 1990</p>

<div th:if="${!bookList.isEmpty()}">
    <div th:each="book : ${bookList}">
        <p th:text="${book.title + ', ' + book.author + ', ' + book.year}">book</p>
    </div>
</div>

<div th:if="${bookList.isEmpty()}" style="color: gray; font-style: italic;">
    <p>Человек пока не взял ни одной книги</p>
</div>

<a th:href="@{/people/{id}/edit(id=${person.personId})}">
    <button type="button">Редактировать</button>
</a>

<form th:method="POST" th:action="@{/people/{id}(id=${person.personId})}">
    <input type="hidden" name="_method" value="DELETE" />
    <input type="submit" value="Удалить"/>
</form>
</body>
</html>
